<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../css/pregunta.css">
</head>
<body class="t-night">

<div id="gate">
  <div class="pulse">♥</div>
  <p class="big" style="margin:22px 0 8px">Cocolón</p>
  <p class="lead" style="margin-top:0">Sube un poquito el volumen.</p>
  <button class="btn main" id="open" style="margin-top:30px">Abrir</button>
</div>

<div id="halo"></div>
<div id="stars" aria-hidden="true"></div>

<!-- Pon tu archivo de la canción en la carpeta  audio/  con este nombre: gongoli.mp3 -->
<audio id="bgm" src="../assets/audios/gongoli.mp3" loop preload="auto"></audio>
<button id="mute" aria-label="Silenciar o activar la música">♪</button>

<div class="wrap">
<a class="back" href="../index.html">← volver</a>

<div id="ask" class="hidden">
  <p class="big rv" style="--d:.3s">Cocolón.</p>
  <p class="lead rv" style="--d:2.6s">Hoy cumplimos seis meses.</p>
  <p class="lead rv" style="--d:5s">Y hoy, además, te dieron un diploma por tu esfuerzo. Estoy muy orgulloso de ti.</p>
  <p class="lead rv" style="--d:8s">Hay algo que quería preguntarte, mirándote.</p>
  <p class="pulse rv" style="--d:10s;margin-top:34px">♥</p>
  <h1 class="rv" style="--d:11.5s;margin-top:14px">¿Quieres ser<br>mi novia?</h1>
  <div class="btns rv" style="--d:14.5s">
    <button class="btn main" id="yes">Sí</button>
    <button class="btn no" id="no">No</button>
  </div>
  <p class="lead" id="noMsg" style="min-height:3em"></p>
</div>

<div id="done" class="hidden">
  <span class="eyebrow" id="dEyebrow"></span>
  <h1 id="dTitle"></h1>
  <div class="line" id="dLine"></div>
  <div id="dLines"></div>
  <div class="polas" id="dPhotos"></div>
  <div class="btns">
    <button class="btn" id="dLetter" hidden></button>
    <a class="btn main" id="dCta" href="NuestraFecha.html"></a>
  </div>
</div>
</div>

<!-- Carta opcional (se llena desde js/pregunta-data.js) -->
<div class="letter" id="letter" hidden>
  <div class="paper">
    <p id="letterText"></p>
    <button class="btn" id="letterClose">Cerrar</button>
  </div>
</div>

<script src="shared.js"></script>
<script src="../js/pregunta-data.js"></script>
<script src="../js/boton-no.js"></script>
<script src="../js/respuesta.js"></script>
<script src="../js/momento-si.js"></script>
<script src="../js/pregunta.js"></script>
</body>
</html>
