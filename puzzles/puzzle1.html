<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Cocolón ♡</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>
<body>

    <div class="ambient-particles" aria-hidden="true">
        <div class="particle-layer particle-layer-1"></div>
        <div class="particle-layer particle-layer-2"></div>
    </div>
    <div class="ambient-stars" aria-hidden="true" id="ambientStars"></div>
    <div class="grain-overlay" aria-hidden="true"></div>

    <main class="intro" style="min-height: 100svh;">
        <div class="intro-background"></div>
        <div class="intro-content">
            <span class="intro-small">
                CÓDIGO ENCONTRADO
            </span>
            <h1 style="font-size: clamp(2.6rem, 8vw, 4.5rem);">
                Bien hecho.
            </h1>
            <p>
                Este es un espacio de ejemplo. Aquí puedes escribir
                una pista, un recuerdo, o dejar el siguiente paso
                de tu propio puzzle.
            </p>
            <a href="../index.html" class="start-button" style="text-decoration:none; display:inline-flex; align-items:center;">
                Volver
                <span>↩</span>
            </a>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
