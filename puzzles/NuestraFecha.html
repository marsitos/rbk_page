<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra fecha ♡</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../css/nuestrafecha.css">
</head>

<body class="t-rose" data-desbloquea="nuestrafecha">
<audio id="musicaFondo" loop preload="auto">
    <source src="../assets/audios/gongoli.mp3" type="audio/mpeg">
</audio>
<button id="btnMusica" class="btn-musica" aria-label="Reproducir música">
    ♫
</button>
<div class="collage" id="collage" aria-hidden="true"></div>
<div class="veil"></div>

<div class="wrap">
<a class="back" href="../index.html">← volver</a>
<span class="eyebrow rv">Nuestra fecha</span>
<h1 class="rv" id="nfFecha">13 · 11 · 2026</h1>
<p class="lead rv" id="nfHora">Juntos desde este día.</p>
<div class="cd rv">
  <div><b id="oD">00</b><span>días</span></div>
  <div><b id="oH">00</b><span>horas</span></div>
  <div><b id="oM">00</b><span>min</span></div>
  <div><b id="oS">00</b><span>seg</span></div>
</div>
<div class="line rv"></div>
<p class="big rv">Y lo que falta.</p>
</div>

<script>
    const musica = document.getElementById("musicaFondo");
    const btnMusica = document.getElementById("btnMusica");

    musica.volume = 0.17;

    let musicaIniciada = false;

    function iniciarMusica() {
        if (musicaIniciada) return;

        musica.play()
            .then(() => {
                musicaIniciada = true;
                btnMusica.textContent = "♫";
                btnMusica.classList.add("reproduciendo");
            })
            .catch(error => {
                console.log("Esperando interacción para reproducir música.");
            });
    }

    // Intentar reproducir al entrar
    iniciarMusica();

    // Activar al primer toque o clic en cualquier parte
    document.addEventListener("click", iniciarMusica, { once: true });
    document.addEventListener("touchstart", iniciarMusica, { once: true });

    // Botón para pausar o reanudar
    btnMusica.addEventListener("click", (e) => {
        e.stopPropagation();

        if (musica.paused) {
            musica.play();
            btnMusica.textContent = "♫";
            btnMusica.classList.add("reproduciendo");
        } else {
            musica.pause();
            btnMusica.textContent = "♪";
            btnMusica.classList.remove("reproduciendo");
        }
    });
</script>
<script src="shared.js"></script>
<script src="../js/momento-si.js"></script>
<script src="../js/nuestrafecha.js"></script>
<script src="../js/desbloqueos.js"></script>
</body>
</html>
