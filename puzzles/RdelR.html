<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050714">
    <title>RdelR 💜</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/RdelR.css">
    <link rel="stylesheet" href="../css/RdelR-telescopio.css">
</head>

<body class="RdelR-page">

    <main class="galaxy-bg">

        <canvas id="stars"></canvas>
        <div class="butterflies" id="butterflies" aria-hidden="true"></div>

        <section class="galaxy-content">
            <h1>You will always be my galaxy</h1>
            <p class="scroll-cue" id="scrollCue" aria-hidden="true"></p>
        </section>

        <!-- Espacio de scroll del descenso: la escena fija (descent-stage) está debajo de </main>

    <!-- ESCENA DEL DESCENSO: noche, pasto y telescopio (se controla desde js/RdelR/RdelR-descenso.js) -->
    <div class="descent-stage" id="descentStage">
        <div class="ds-world">
            <div class="ds-sky"></div>
            <div class="ds-band"></div>
            <canvas class="ds-stars" id="dsStars"></canvas>
            <div class="ds-moon"></div>

            <svg class="ds-hill ds-hill-far" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true"><path id="hillFar" /></svg>
            <svg class="ds-hill ds-hill-mid" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true"><path id="hillMid" /></svg>
            <svg class="ds-hill ds-hill-near" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true"><path id="hillNear" /><path id="hillBlades" /></svg>
            <div class="ds-fireflies" id="dsFireflies" aria-hidden="true"></div>

            <button class="ds-telescope" id="dsTelescope" type="button" disabled aria-label="Mirar por el telescopio">
                <span class="ds-cue" id="dsCue"></span>
                <svg viewBox="0 0 240 340" aria-hidden="true">
                    <g stroke="#3a2f66" stroke-width="7" stroke-linecap="round" fill="none">
                        <line x1="120" y1="168" x2="52" y2="334" />
                        <line x1="120" y1="168" x2="188" y2="334" />
                        <line x1="120" y1="168" x2="120" y2="334" />
                    </g>
                    <g stroke="rgba(233,176,242,.35)" stroke-width="1.4" stroke-linecap="round" fill="none">
                        <line x1="123" y1="170" x2="55" y2="334" />
                        <line x1="123" y1="170" x2="191" y2="334" />
                    </g>
                    <circle cx="120" cy="168" r="13" fill="#2b2250" stroke="rgba(233,176,242,.45)" />
                    <g transform="rotate(38 120 168)">
                        <rect x="102" y="20" width="36" height="156" rx="10" fill="#33285c" stroke="rgba(233,176,242,.5)" stroke-width="1.4" />
                        <rect x="98" y="14" width="44" height="20" rx="6" fill="#3d3170" stroke="rgba(233,176,242,.45)" />
                        <rect x="102" y="74" width="36" height="5" fill="rgba(233,176,242,.35)" />
                        <rect x="113" y="176" width="14" height="22" rx="3" fill="#2b2250" stroke="rgba(233,176,242,.45)" />
                        <circle id="dsEyepiece" cx="120" cy="202" r="7" fill="#E9B0F2" opacity=".9" />
                        <circle class="ds-eye-glow" cx="120" cy="202" r="9" fill="none" stroke="#E9B0F2" stroke-width="2" />
                    </g>
                </svg>
            </button>
        </div>
    </div>

    <!-- VISOR DEL TELESCOPIO (js/RdelR/RdelR-telescopio.js) -->
    <div class="scope" id="scope" role="dialog" aria-modal="true" aria-label="Telescopio" aria-hidden="true">
        <div class="scope-wrap" id="scopeWrap">
            <div class="scope-lens" id="scopeLens"><canvas id="scopeCanvas"></canvas></div>
            <span class="scope-hint" id="scopeHint" aria-hidden="true">›</span>
            <div class="scope-ring" aria-hidden="true"></div>
        </div>
        <p class="scope-help" id="scopeHelp"></p>
        <div class="scope-dots" id="scopeDots" aria-hidden="true"></div>
        <button class="scope-close" id="scopeClose" type="button"></button>
    </div>
        <section class="descent" id="descent" aria-hidden="true"></section>

    </main>

    <div class="text-modal hidden" aria-hidden="true">
        <div class="text-box">
            <p id="star-text"></p>
            <button id="closeText" type="button" aria-label="Cerrar mensaje">
                ✦
            </button>

            <!-- Última estrella: la pregunta -->
            <div id="question" hidden>
                <div class="q-icon" id="qIcon"></div>
                <p class="q-small" id="qIntro"></p>
                <h3 class="q-title" id="qTitle"></h3>
                <div class="q-btns">
                    <button class="q-btn q-yes" id="yes" type="button">Sí</button>
                    <button class="q-btn q-no" id="no" type="button">No</button>
                </div>
                <p class="q-msg" id="noMsg"></p>
            </div>

            <!-- Después del "Sí" -->
            <div id="answer" hidden>
                <p class="q-small" id="aEyebrow"></p>
                <h3 class="q-title" id="aTitle"></h3>
                <p class="a-time" id="aTime"></p>
                <p class="a-words" id="aWords"></p>
                <a class="q-btn q-yes" id="aCta" href="NuestraFecha.html"></a>
            </div>
        </div>
    </div>
    <!-- <div class="back-container">
        <a href="../index.html" class="start-button">
            Volver
            <span>↩</span>
        </a>
    </div> -->

    <script src="../js/momento-si.js"></script>
    <script src="../js/RdelR/RdelR-data.js"></script>
    <script src="../js/RdelR/RdelR-fondo.js"></script>
    <script src="../js/desbloqueos.js"></script>
    <script src="../js/RdelR/RdelR-viaje.js"></script>
    <script src="../js/RdelR/RdelR-pregunta.js"></script>
    <script src="../js/RdelR/RdelR-cielo.js"></script>
    <script src="../js/RdelR/RdelR-telescopio.js"></script>
    <script src="../js/RdelR/RdelR-descenso.js"></script>
    <script src="../js/RdelR/RdelR-escritorio.js"></script>
</body>
</html>
