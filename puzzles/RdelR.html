<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050714">
    <title>RdelR 💜</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/RdelR.css">
</head>

<body class="RdelR-page">

    <main class="galaxy-bg">

        <canvas id="stars"></canvas>

        <section class="galaxy-content">
            <h1>You will always be my galaxy</h1>
        </section>

        <section class="virgo-section">

            <h2 class="virgo-title">✦ una pequeña constelación para ti ✦</h2>

            <div class="virgo-constellation">
                <svg class="virgo-svg" viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet" aria-hidden="true">

                    <!-- Líneas de la constelación -->
                    <line class="virgo-line" x1="747" y1="60"  x2="810" y2="60"  />
                    <line class="virgo-line" x1="810" y1="60"  x2="837" y2="175" />
                    <line class="virgo-line" x1="837" y1="175" x2="747" y2="225" />
                    <line class="virgo-line" x1="747" y1="225" x2="657" y2="275" />
                    <line class="virgo-line" x1="657" y1="275" x2="567" y2="225" />
                    <line class="virgo-line" x1="567" y1="225" x2="450" y2="300" />
                    <line class="virgo-line" x1="450" y1="300" x2="333" y2="275" />
                    <line class="virgo-line" x1="333" y1="275" x2="180" y2="300" />
                    <line class="virgo-line" x1="567" y1="225" x2="486" y2="150" />
                    <line class="virgo-line" x1="657" y1="275" x2="567" y2="350" />
                    <line class="virgo-line" x1="450" y1="300" x2="540" y2="450" />
                    <line class="virgo-line" x1="567" y1="350" x2="540" y2="450" />
                    <line class="virgo-line" x1="540" y1="450" x2="360" y2="500" />
                    <line class="virgo-line" x1="360" y1="500" x2="315" y2="425" />
                    <line class="virgo-line" x1="315" y1="425" x2="207" y2="440" />

                    <!-- Estrellas principales -->
                    <circle class="virgo-star active" data-index="0" id="s1" cx="747" cy="60"
                        r="6" stroke="transparent" stroke-width="16" pointer-events="all" />
                    <circle class="virgo-star locked" data-index="1" id="s2" cx="747" cy="225"
                        r="6" stroke="transparent" stroke-width="16" pointer-events="all" />
                    <circle class="virgo-star locked" data-index="2" id="s3" cx="567" cy="350"
                        r="6" stroke="transparent" stroke-width="16" pointer-events="all" />
                    <circle class="virgo-star locked" data-index="3" id="s4" cx="360" cy="500"
                        r="6" stroke="transparent" stroke-width="16" pointer-events="all" />
                    <circle class="virgo-star locked" data-index="4" id="s5" cx="207" cy="440"
                        r="6" stroke="transparent" stroke-width="16" pointer-events="all" />

                    <!-- Estrellas decorativas -->
                    <circle class="virgo-star decorative" cx="810" cy="60"  r="3" />
                    <circle class="virgo-star decorative" cx="837" cy="175" r="3" />
                    <circle class="virgo-star decorative" cx="657" cy="275" r="3" />
                    <circle class="virgo-star decorative" cx="567" cy="225" r="3" />
                    <circle class="virgo-star decorative" cx="486" cy="150" r="3" />
                    <circle class="virgo-star decorative" cx="450" cy="300" r="3" />
                    <circle class="virgo-star decorative" cx="540" cy="450" r="3" />
                    <circle class="virgo-star decorative" cx="315" cy="425" r="3" />
                    <circle class="virgo-star decorative" cx="333" cy="275" r="3" />
                    <circle class="virgo-star decorative" cx="180" cy="300" r="3" />

                </svg>
            </div>
        </section>

    </main>

    <div class="text-modal hidden" aria-hidden="true">
        <div class="text-box">
            <p id="star-text"></p>
            <button id="closeText" type="button" aria-label="Cerrar mensaje">
                ✦
            </button>
        </div>
    </div>
    <div class="back-container">
        <a href="../index.html" class="start-button">
            Volver
            <span>↩</span>
        </a>
    </div>

    <script src="../js/RdelR.js"></script>
</body>
</html>
